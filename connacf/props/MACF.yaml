# MACF (Multi-Agent Collaborative Filtering) Configuration
# This file contains default parameters for MACF inference

# Number of similar users to recruit as User Agents
# These agents represent neighbors whose preferences inform recommendations
neighbor_count: 25

# Number of history items to recruit as Item Agents
# These agents represent query-relevant items from the target user's history
history_item_count: 25

# Number of candidates returned per retrieval tool call
# Used by GetSimilarUsers, GetRelevantItems, RetrieveByQuery, RetrieveByItem
retrieval_k: 15

# Maximum number of discussion rounds
# Discussion may terminate early if convergence is detected
max_rounds: 5

# Minimum number of discussion rounds before allowing convergence
# Ensures multi-turn discussion even if initial suggestions are good
min_rounds: 5

# Final ranked list size (K in top-K recommendations)
# The orchestrator will produce exactly this many recommendations
top_k_recommendation: 10

# Batch size for embedding API calls
# Controls how many items are embedded in a single API request
api_batch: 20

# Batch size for chat LLM API calls
# Controls how many agent responses are generated in parallel
chat_api_batch: 10
