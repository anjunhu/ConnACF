# DrunkAgent with 50% Item Poisoning
# In dynamic mode: poisons 50% of ACTIVE items per task

attack:
  method: "Drunk"
  enable_attack: true
  current_task_id: 0
  update_strategy: 'all'

  # ==================== TOPOLOGY CONFIGURATION ====================
  num_candidates: 1
  disable_item_backward: false

  # Dynamic selection: select attackers from active agents per task
  # If true: only poison items that are actually participating in each task
  # If false: poison items upfront before any tasks run
  dynamic_selection: true
  
  # Subset configuration
  # subset_mode: true
  # subset_config:
  #   n_users: 50
  #   n_items: 100
  #   selection_strategy: 'most_active'
  #   min_interactions_per_user: 5
  
  # Poison 50% of items (or 50% of active items in dynamic mode)
  attacker_ratio: 0.50
  target_item_selection: 'active'
  
  # Surrogate configuration
  surrogate_model: "llama-3-8b"
  use_general_user_memories: true
  use_popular_items: true
  top_k_popular_items: 100
  n_users: 50
  
  # Bedrock Claude configuration
  bedrock_config:
    model_id: "anthropic.claude-3-sonnet-20240229-v1:0"
    region: "us-east-1"
  
  # DrunkAgent parameters
  perturbation_budget: 50
  greedy_search_iterations: 10
  
  # Strategy configuration
  drunk_strategies:
    - "fake_task_response"
    - "contextual_text_switching"
    - "gibberish"
    - "newline"
    - "special_chars"
  
  optimize_strategy_sequence: true
  use_subtle_strategies: true  # Use subtle triggers that LLMs won't detect
  
  # Canary concepts
  canary_concepts:
    target_artists:
      - "Huun-Huur-Tu"
      - "the Benedictine Monks of Santo Domingo de Silos"
      - "Choir of Trinity College Cambridge"
    target_genres:
      - "Mongolian throat singing"
      - "Gregorian chants"
      - "Medieval organ music and hymns"
    incorporate_in_description: true
  
  # Evaluation
  compute_perplexity: true
  compute_valid_rate: true
  valid_rate_threshold: 0.8
  eval_frequency: 1
  eval_subset_size: 20
  
  # LLM Judge
  llm_judge:
    enable_llm_judge: true
    llm_judge_temperature: 0.0
    llm_judge_frequency: 1
    llm_judge_quick_mode: true
    llm_contamination_threshold: 0.5
    track_canary_propagation: true
    enable_memory_contamination_judge: true
    memory_contamination_threshold: 3.0
    compare_to_ideal_profile: true
    max_batch_size: 6  # Reduced from 10 to prevent JSON truncation issues
    # Contamination evaluation mode: 'all_agents' or 'participating_only'
    contamination_eval_mode: 'all_agents'
  
  # Metrics
  metrics:
    collect_per_round_metrics: true
    contamination_threshold: 0.1
  
  # Visualization
  visualization:
    generate_plots: true
    plot_contamination_timeline: true
    plot_performance_degradation: true
    plot_during_training: true
    visualization_frequency: 1
  
  # Output
  output:
    output_directory: "attack_output/drunk/drunk_50percent_1cand"
  
  cache_optimized_attacks: true
  update_strategy: 'all'
  primary_strategy: drunk_poisoning
  scenario_type: single_strategy
