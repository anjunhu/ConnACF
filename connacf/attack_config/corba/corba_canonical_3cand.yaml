# Corba — Contagious Recursive Blocking Attack (3 candidates)
# Dense connectivity: 3 item candidates per user per turn.
# Tests whether higher item exposure accelerates contagion spread.
# See corba_canonical_2cand.yaml for full field documentation.

attack:
  method: "Corba"
  enable_attack: true
  current_task_id: 0

  payload_variant: "canonical"
  enhanced: false

  item_attacker_ratio: 0.25        # Fraction of items to poison (ID 0 = PAD, excluded)

  num_candidates: 3
  easy_mode: true                   # Skip LLM backward — keeps item descriptions stable
  disable_item_backward: false
  enable_uu_interaction: true
  uu_friends_count: 2
  uu_opinion_max_tokens: 150
  enable_ui_interaction: false
  ui_dialogue_rounds: 2

  output:
    output_directory: "attack_output/corba/corba_canonical_3cand"
    save_conversation_logs: true

  metrics:
    collect_per_round_metrics: true
    track_infection_rate: true

  visualization:
    generate_plots: true
    plot_infection_curve: true
    plot_memory_infection: true
    plot_during_training: true
    visualization_frequency: 1

  llm_judge:
    enable_llm_judge: false

  wandb:
    enable_wandb: false
    project: "connacf-attacks"
    tags: ["corba", "canonical", "3cand"]
