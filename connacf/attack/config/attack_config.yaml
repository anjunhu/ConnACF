# ConnaCF Attack Configuration
# Configuration for NetSafe multi-hop attack integration

attack:
  # Enable/disable attack mode
  enable_attack: true
  
  # Interaction control (replaces arbitrary graph topologies)
  interaction_density: 1.0  # 0.0 to 1.0, controls how many agents interact
  interaction_pattern: "similarity"  # similarity, random, clustered
  max_similar_users: 5  # Maximum similar users for interaction
  max_similar_items: 5  # Maximum similar items for interaction
  similarity_threshold: 0.5  # Minimum similarity for interaction
  
  # Attack scenario configuration
  scenario_type: "single_strategy"  # single_strategy, multi_strategy, coordinated
  attacker_ratio: 0.1  # Fraction of agents that are attackers
  
  # Specific attacker indices (optional, overrides ratio-based selection)
  attacker_user_indices: []  # [0, 1, 2] - specific user IDs to compromise
  attacker_item_indices: []  # [10, 20, 30] - specific item IDs to compromise
  
  # System agent compromise
  system_agent_compromised: false
  system_compromise_probability: 0.3
  
  # Attack strategies
  primary_strategy: "preference_injection"  # Main attack strategy
  
  # Strategy-specific configurations
  preference_injection:
    target_genres: ["rock", "pop", "electronic"]
    target_artists: ["Malicious Artist 1", "Malicious Artist 2"]
    injection_strength: 0.8
  
  description_poisoning:
    poison_features: ["addictive", "viral", "trending", "must-listen"]
    target_items: ["Poisoned Track 1", "Poisoned Track 2"]
    poisoning_intensity: 0.7
  
  bias_amplification:
    bias_attributes: ["mainstream", "popular", "commercial", "chart-topping"]
    amplification_factor: 1.5
  
  popularity_manipulation:
    target_items: ["Boosted Track 1", "Boosted Track 2", "Boosted Track 3"]
    manipulation_strength: 0.9
    fake_popularity_signals: ["trending", "viral", "everyone is talking about", "must-listen"]
  
  coordinated_attack:
    user_attack_ratio: 0.2
    item_attack_ratio: 0.1
    system_compromise: false
    coordination_strength: 0.8
  
  # Multi-strategy configuration
  multi_strategy:
    strategies: ["preference_injection", "description_poisoning"]
    strategy_distribution: "equal"  # equal, weighted, random
  
  # Metrics collection
  metrics:
    contamination_threshold: 0.1  # Threshold for considering agent contaminated
    collect_per_round_metrics: true
    save_interaction_graphs: true
    track_influence_propagation: true
  
  # Evaluation parameters
  evaluation:
    max_interaction_rounds: 10  # Maximum rounds for attack propagation
    baseline_comparison: true  # Compare with clean (no-attack) baseline
    statistical_significance: true  # Compute confidence intervals
    
  # Output configuration
  output:
    save_metrics: true
    output_directory: "attack_results"
    experiment_name_prefix: "connacf_netsafe"
    save_agent_states: false  # Save detailed agent states (large files)
    
  # Visualization
  visualization:
    generate_plots: true
    plot_contamination_timeline: true
    plot_performance_degradation: true
    plot_interaction_graphs: true
    save_high_res: true
    plot_format: "png"  # png, pdf, svg

# Experimental scenarios for systematic evaluation
experimental_scenarios:
  # Scenario 1: Varying attacker ratios
  attacker_ratio_sweep:
    scenario_type: "single_strategy"
    primary_strategy: "preference_injection"
    attacker_ratios: [0.05, 0.1, 0.15, 0.2, 0.25]
    interaction_density: 0.3
  
  # Scenario 2: Different interaction patterns
  interaction_pattern_comparison:
    scenario_type: "single_strategy"
    primary_strategy: "preference_injection"
    attacker_ratio: 0.1
    interaction_patterns: ["similarity", "random", "clustered"]
    interaction_densities: [0.1, 0.3, 0.5, 0.7]
  
  # Scenario 3: Multi-strategy attacks
  multi_strategy_evaluation:
    scenario_type: "multi_strategy"
    strategies: [
      ["preference_injection"],
      ["description_poisoning"],
      ["preference_injection", "description_poisoning"],
      ["preference_injection", "bias_amplification"],
      ["coordinated_attack"]
    ]
    attacker_ratio: 0.15
  
  # Scenario 4: Coordinated attacks with system compromise
  coordinated_with_system:
    scenario_type: "coordinated"
    user_attack_ratio: 0.1
    item_attack_ratio: 0.05
    system_compromise: true
    system_compromise_probabilities: [0.1, 0.3, 0.5, 0.7]
  
  # Scenario 5: Temporal attack progression
  temporal_progression:
    scenario_type: "single_strategy"
    primary_strategy: "preference_injection"
    attacker_ratio: 0.1
    max_rounds: [5, 10, 15, 20]
    interaction_density: 0.3

# NetSafe compatibility settings
netsafe_compatibility:
  # Map ConnaCF interaction patterns to NetSafe graph types
  graph_type_mapping:
    similarity_dense: "complete"  # High similarity threshold + high density
    similarity_sparse: "tree"     # High similarity threshold + low density
    random_dense: "star"          # Random interactions + high density
    random_sparse: "chain"        # Random interactions + low density
    clustered: "circle"           # Clustered interactions
  
  # NetSafe evaluation metrics
  enable_netsafe_metrics: true
  calculate_network_efficiency: true
  calculate_eigenvector_centrality: true
  calculate_path_vulnerability: true
  
  # Attack propagation analysis
  track_multi_hop_propagation: true
  max_propagation_hops: 5
  influence_decay_factor: 0.8